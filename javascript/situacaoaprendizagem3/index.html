<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsToday - Portal de Notícias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📰 NewsToday</h1>
        <p>Portal de Notícias Interativo</p>
    </header>

    <main>

        <section class="pesquisa">
            <input
                type="text"
                id="campoPesquisa"
                placeholder="Digite um assunto (SpaceX, NASA, Marte...)"
            >

            <button id="btnPesquisar">
                Pesquisar
            </button>
        </section>

        <div id="contador"></div>

        <section id="resultado"></section>

    </main>

    <script src="script.js"></script>

</body>
</html>
